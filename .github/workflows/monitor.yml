name: Check sites
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check every site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash check.sh
      # GitHub switches off scheduled runs in a repo with no commits for 60 days, so commit a heartbeat monthly.
      - name: Keep the schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u '+%Y-%m-%d' > heartbeat.txt
            git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
            git add heartbeat.txt && git commit -m 'Heartbeat: keep the scheduled checks running' && git push
          fi
