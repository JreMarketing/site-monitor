name: Check sites
# Started only by the DigitalOcean droplet every 5 minutes (droplet/run-monitor.sh). GitHub's own 5-minute schedule
# was removed on 10 Nov 2026 so there is one source of alerts (it only ran ~30 times a day and SiteGround's bot check
# challenges GitHub's runners). The daily watchdog task flags it if the droplet stops handing over for 2 hours.
on:
  workflow_dispatch:
    inputs:
      report:
        description: 'Results from the monitoring server, one "name<TAB>result" line per site (empty: check from here)'
        required: false
        default: ''
permissions:
  contents: write
  issues: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check every site
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ inputs.report }}
        run: bash check.sh
      # GitHub switches off scheduled runs in a repo with no commits for 60 days, so commit a heartbeat monthly.
      - name: Keep the schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            date -u '+%Y-%m-%d' > heartbeat.txt
            git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
            git add heartbeat.txt && git commit -m 'Heartbeat: keep the scheduled checks running' && git push
          fi
